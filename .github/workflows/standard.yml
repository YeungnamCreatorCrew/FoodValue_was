# 모델 비교 실험 기준서 v1(model_comparison/MODEL_TRAINING_STANDARD.md) 준수 검사.
# PR마다 공통 도구 테스트와 experiments/ 아래 모든 실험 결과의 제출 형식을 검사한다. 실패하면 머지하지 않는다.
name: standard-v1

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: 확정 lock 그대로 설치 (lock과 pyproject가 어긋나면 실패)
        run: uv sync --locked --group dev --extra prices
      - name: 공통 도구 테스트
        run: uv run --group dev --extra prices pytest tests/test_standard_tools.py -q -p no:cacheprovider
      - name: 실험 결과·기준서 판 검사
        run: uv run --extra prices python -m tools.validate_experiment --all
