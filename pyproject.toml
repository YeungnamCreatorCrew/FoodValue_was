[project]
name = "foodvalue"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "google-genai>=2.28.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
prices = [
    "xgboost>=3.0,<4",
    "scikit-learn>=1.6,<2",
    "korean-lunar-calendar>=0.3,<1",
    "lightgbm>=4.5,<5",
    "statsforecast>=2,<3",
    "optuna>=4,<5",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
